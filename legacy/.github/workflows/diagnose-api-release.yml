name: Diagnose API release (read only)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Fixed read-only diagnostic mode
        type: choice
        options:
          - metadata
          - token_identity
        default: metadata
permissions:
  contents: read
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    environment: runlater-public-api
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Bounded fixed GETs with redacted results
        env:
          RUNLATER_DIAGNOSTIC_MODE: ${{ inputs.mode || 'metadata' }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RUNLATER_RELEASE_CONFIG: ${{ vars.RUNLATER_RELEASE_CONFIG }}
          RUNLATER_RELEASE_APPROVAL: ${{ vars.RUNLATER_RELEASE_APPROVAL }}
        run: node scripts/api-release-diagnostic.mjs
