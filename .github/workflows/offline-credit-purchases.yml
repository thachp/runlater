name: Offline credit purchase contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - run: cargo fmt --manifest-path offline/credit-purchases/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path offline/credit-purchases/Cargo.toml
      - run: cargo check --locked --manifest-path offline/credit-purchases/Cargo.toml --target wasm32-unknown-unknown
