name: Deploy environment
# Deploys every Worker to one wrangler environment. Order matters: the gateway's
# service binding needs the API Worker to exist first.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: cargo install worker-build --version 0.8.7 --locked
      - run: npm ci

      # Secrets come from the GitHub environment (scripts/setup-deploy-secrets.mjs) and reach
      # Cloudflare only at deploy time, through a temp file removed straight after.
      - name: Deploy api
        env:
          GATEWAY_PUBLIC_KEY: ${{ vars.GATEWAY_PUBLIC_KEY }}
        run: |
          test -n "$GATEWAY_PUBLIC_KEY" || { echo "::error::GATEWAY_PUBLIC_KEY is not set; run scripts/setup-deploy-secrets.mjs"; exit 1; }
          npx wrangler deploy --env "$DEPLOY_ENV" --var "GATEWAY_PUBLIC_KEY:$GATEWAY_PUBLIC_KEY"
        working-directory: apps/api

      # Forward-only; must apply before the gateway that reads the new schema deploys.
      - name: Apply gateway D1 migrations
        run: npx wrangler d1 migrations apply DB --env "$DEPLOY_ENV" --remote
        working-directory: apps/gateway

      - name: Deploy gateway
        env:
          ASSERTION_PRIVATE_KEY: ${{ secrets.ASSERTION_PRIVATE_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          test -n "$ASSERTION_PRIVATE_KEY" && test -n "$BETTER_AUTH_SECRET" || { echo "::error::gateway secrets are not set; run scripts/setup-deploy-secrets.mjs"; exit 1; }
          secrets="$(mktemp "$RUNNER_TEMP/secrets.XXXXXX")"
          trap 'rm -f "$secrets"' EXIT
          node -e 'const e=process.env;process.stdout.write(JSON.stringify({ASSERTION_PRIVATE_KEY:e.ASSERTION_PRIVATE_KEY,BETTER_AUTH_SECRET:e.BETTER_AUTH_SECRET}))' > "$secrets"
          npx wrangler deploy --env "$DEPLOY_ENV" --secrets-file "$secrets"
        working-directory: apps/gateway

      - name: Deploy web
        run: npm run deploy -w @runlater/web -- --env "$DEPLOY_ENV"

      # Test fixture the staging journey delivers to. Never deployed to production.
      - name: Deploy staging receiver
        if: inputs.environment == 'staging'
        env:
          RECEIVER_TOKEN: ${{ secrets.RECEIVER_TOKEN }}
        run: |
          test -n "$RECEIVER_TOKEN" || { echo "::error::RECEIVER_TOKEN is not set; run scripts/setup-deploy-secrets.mjs"; exit 1; }
          secrets="$(mktemp "$RUNNER_TEMP/secrets.XXXXXX")"
          trap 'rm -f "$secrets"' EXIT
          node -e 'process.stdout.write(JSON.stringify({RECEIVER_TOKEN:process.env.RECEIVER_TOKEN}))' > "$secrets"
          npx wrangler deploy --env staging --secrets-file "$secrets"
        working-directory: apps/receiver

      # The gateway health check also reaches the API through its binding.
      - name: Smoke check
        if: vars.GATEWAY_URL != ''
        env:
          GATEWAY_URL: ${{ vars.GATEWAY_URL }}
        run: curl --fail --silent --show-error --max-time 10 --retry 3 --retry-all-errors "$GATEWAY_URL/health"

      # A real agent journey: register, create a project, schedule deliveries to the receiver,
      # verify signatures, retries, cancel. Once GATEWAY_URL is set this is required: missing
      # RECEIVER_URL or RECEIVER_TOKEN fails it, and a failure stops production.
      - name: Staging journey
        if: inputs.environment == 'staging' && vars.GATEWAY_URL != ''
        timeout-minutes: 10
        env:
          GATEWAY_URL: ${{ vars.GATEWAY_URL }}
          RECEIVER_URL: ${{ vars.RECEIVER_URL }}
          RECEIVER_TOKEN: ${{ secrets.RECEIVER_TOKEN }}
        run: node apps/gateway/e2e/staging.mjs
