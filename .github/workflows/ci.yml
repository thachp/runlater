name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p runlater-api -- -D warnings

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  workers:
    # Bundles every Worker exactly as `wrangler deploy` would, without deploying.
    needs: [rust, typescript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: cargo install worker-build --version 0.8.7 --locked
      - run: npm ci
      - run: npx wrangler deploy --dry-run --outdir dist
        working-directory: apps/api
      # Drives the built API in local workerd: Durable Object SQLite, alarms, Queues.
      - run: npm run test:e2e
        working-directory: apps/api
      - run: npx wrangler deploy --dry-run --outdir dist
        working-directory: apps/gateway
      # Gateway + API together, driven by the real Agent Auth SDK and the MCP bridge.
      - run: npm run test:e2e
        working-directory: apps/gateway
      - run: npm run check -w @runlater/web
