[workspace]
resolver = "2"
members = ["crates/core", "crates/egress", "apps/api"]
exclude = ["legacy"]

[workspace.package]
edition = "2021"
rust-version = "1.92"
publish = false

[workspace.dependencies]
runlater-core = { path = "crates/core" }
runlater-egress = { path = "crates/egress" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worker = "=0.8.7"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
url = "2"

[profile.release]
lto = true
opt-level = "s"
