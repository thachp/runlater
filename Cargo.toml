[package]
name = "runlater"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
staging = []
runtime-tests = []
production = []
funding-tests = []
destination-tests = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
url = "2"
subtle = "2.6"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "zeroize"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = "0.3"
worker = { version = "=0.8.7", features = ["queue"] }

[profile.release]
lto = true
opt-level = "s"
