openapi: 3.1.0
info:
  title: RunLater internal API
  version: 0.1.0
  description: >
    Contract between apps/gateway (TypeScript) and apps/api (Rust). Not public:
    the API is reached only over a service binding. See docs/spec/ARCHITECTURE.md.
    Routes other than /health are specified here first and implemented in phase 3.
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required: [service, status]
                properties:
                  service: { type: string }
                  status: { const: ok }
